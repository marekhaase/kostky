<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kostky do hroba</title>
<meta name="description" content="Jednoduchá tabulka skóre pro koulimkovou hru (KCD) – ruční zápis kol.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@400;600;700&display=swap">
<link rel="stylesheet" href="kostky.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Kostky</h1>
    </div>
    <div class="top-actions">
      <button id="settingsBtn" class="ghost">Nastavení</button>
      <button id="themeBtn" class="ghost" aria-label="Přepnout téma">Téma</button>
    </div>
  </header>

  <section class="card" aria-label="Hráči a skóre">
    <div class="card-head">
      <h2>Tabulka</h2>
      <button id="addPlayerBtn" class="ghost">+ Hráč</button>
    </div>
    <div class="table-wrap">
      <table class="tboard" id="scoreboard">
        <thead>
          <tr><th>#</th><th>Hráč</th><th>Kola</th><th>Celkem</th><th>Zbývá</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card" aria-label="Přidat kolo" style="margin-top:16px;">
    <div class="card-head"><h2>Zapsat kolo</h2></div>
    <div class="card-pad" style="display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:end;">
      <div>
        <label for="currentPlayer">Na řadě</label>
        <input type="text" id="currentPlayer" readonly style="width:100%; background:var(--surface2); color:var(--ink); font-weight:600;">
      </div>
      <div>
        <label for="manualScore">Body</label>
        <input type="number" id="manualScore" min="0" max="10000" step="10" value="" placeholder="0" style="width:110px;">
      </div>
      <div style="grid-column: 1 / -1; display:flex; gap:10px; justify-content:flex-end;">
        <button id="manualAddBtn" class="primary">Přidat</button>
      </div>
    </div>
  </section>

  <div id="winnerBanner" class="winner-banner" hidden>
    <div class="txt"><b id="winnerName"></b> dosáhl <b id="winnerScore"></b> bodů — hra končí!</div>
  </div>

<script src="kostky.js"></script>

<div id="settingsModal" class="modal-veil" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h3 id="modalTitle">Nastavení</h3>
    <div class="modal-pad">
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
        <div class="field">
          <label for="setWin">Výherní body</label>
          <input type="number" id="setWin" min="1000" max="100000" step="100" value="10000">
        </div>
        <div class="field">
          <label for="setMin">Minimál na zápis</label>
          <input type="number" id="setMin" min="0" max="5000" step="50" value="500">
        </div>
      </div>
      <div class="actions">
        <button id="settingsCancel" class="ghost">Zrušit</button>
        <button id="settingsSave" class="primary">Uložit a restartovat</button>
      </div>
      <p class="confirm-note" id="confirmNote" hidden>Restart hry vymaže veškeré skóre a historii. Opravdu pokračovat?</p>
    </div>
  </div>
</div>

</body>
</html>
